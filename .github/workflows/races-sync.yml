name: Daily race calendar sync

# Celery beat v prod reálně neběží (Celery EAGER setup, žádný worker).
# PeriodicTask zaregistrovaná přes `setup_race_beat` se tak sama
# nespustí a label „Data aktualizována" na /kalendar postupně
# zestárne. Tenhle workflow jednou denně pingne shared-secret
# endpoint, který sync spustí server-side.
on:
  schedule:
    # 02:12 UTC = 03:12/04:12 Praha. Vybráno mimo kulatou hodinu —
    # GitHub Actions přetíženost na :00 zpomaluje scheduled běhy.
    - cron: "12 2 * * *"
  workflow_dispatch:

concurrency:
  group: races-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/races/sync-trigger/
        env:
          RACES_SYNC_TOKEN: ${{ secrets.RACES_SYNC_TOKEN }}
        run: |
          if [ -z "$RACES_SYNC_TOKEN" ]; then
            echo "✗ RACES_SYNC_TOKEN secret není nastavený"
            exit 1
          fi
          resp=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RACES_SYNC_TOKEN" \
            https://api.olaf.events/api/races/sync-trigger/)
          echo "HTTP $resp"
          cat response.json
          echo
          test "$resp" = "200"
